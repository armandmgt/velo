services:
  db:
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NOMINATIM_DB: ${NOMINATIM_DB}
      TILES_DB: ${TILES_DB}
      PGDATA: /var/lib/postgresql/16/main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/16/main:z
      # init-db.sh is kept for extension setup if starting with an empty volume
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nominatim:
    image: mediagis/nominatim:5.2
    restart: always
    environment:
      - NOMINATIM_TOKENIZER=icu
      - NOMINATIM_DATABASE_DSN=pgsql:host=db;port=5432;user=${POSTGRES_USER};password=${POSTGRES_PASSWORD};dbname=${NOMINATIM_DB}
      - PGHOST=db
      - PGDATABASE=${NOMINATIM_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PBF_PATH=/tmp/data.osm.pbf
      - IMPORT_STYLE=admin
      - IMPORT_WIKIPEDIA=true
    ports:
      - "8080:8080"
    volumes:
      - ./data.osm.pbf:/tmp/data.osm.pbf:z
      - nominatim-flat-data:/var/lib/nominatim:z
    depends_on:
      db:
        condition: service_healthy

  tileserver:
    image: maplibre/martin:latest
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${TILES_DB}
    ports:
      - "8081:3000"
    depends_on:
      db:
        condition: service_healthy

  osm2pgsql:
    image: postgis/postgis:16-3.4
    entrypoint: /bin/sh -c "apt-get update && apt-get install -y osm2pgsql curl && osm2pgsql --create --slim --hstore --database ${TILES_DB} --host db --port 5432 --username ${POSTGRES_USER} /tmp/data.osm.pbf"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - TILES_DB=${TILES_DB}
    volumes:
      - ./data.osm.pbf:/tmp/data.osm.pbf:z
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - import

volumes:
  postgres_data:
  nominatim-flat-data:
