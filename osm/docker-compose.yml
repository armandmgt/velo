services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NOMINATIM_DB: ${NOMINATIM_DB}
      TILES_DB: ${TILES_DB}
      PGDATA: /var/lib/postgresql/16/main
    volumes:
      - postgres_data:/var/lib/postgresql/16/main:z
      # init-db.sh is kept for extension setup if starting with an empty volume
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nominatim:
    image: mediagis/nominatim:latest
    restart: always
    environment:
      - NOMINATIM_DATABASE_DSN=pgsql:host=db;port=5432;user=${POSTGRES_USER};password=${POSTGRES_PASSWORD};dbname=${NOMINATIM_DB}
      - NOMINATIM_PBF_URL=${OSM_PBF_URL}
      - NOMINATIM_IMPORT_STYLE=address
    ports:
      - "8080:8080"
    volumes:
      - nominatim-flat-data:/var/lib/nominatim:z
    depends_on:
      db:
        condition: service_healthy

  tileserver:
    image: maplibre/martin:latest
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${TILES_DB}
    ports:
      - "8081:3000"
    depends_on:
      db:
        condition: service_healthy

  osm2pgsql:
    image: postgis/postgis:16-3.4
    entrypoint: /bin/sh -c "apt-get update && apt-get install -y osm2pgsql curl && curl -o /tmp/data.osm.pbf ${OSM_PBF_URL} && osm2pgsql --create --slim --hstore --database ${TILES_DB} --host db --port 5432 --username ${POSTGRES_USER} /tmp/data.osm.pbf"
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - OSM_PBF_URL=${OSM_PBF_URL}
      - TILES_DB=${TILES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - import

volumes:
  postgres_data:
  nominatim-flat-data:
