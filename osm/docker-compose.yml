services:
  db:
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NOMINATIM_DB: ${NOMINATIM_DB}
      PGDATA: /var/lib/postgresql/16/main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/16/main:z
      # init-db.sh is kept for extension setup if starting with an empty volume
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nominatim:
    image: mediagis/nominatim:5.2
    restart: always
    environment:
      - TOKENIZER=icu
      - DATABASE_DSN=pgsql:host=db;port=5432;user=${POSTGRES_USER};password=${POSTGRES_PASSWORD};dbname=${NOMINATIM_DB}
      - PGHOST=db
      - PGDATABASE=${NOMINATIM_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PBF_URL=${OSM_PBF_URL}
      - PROJECT_DIR=/data
      - IMPORT_STYLE=admin
      - IMPORT_WIKIPEDIA=true
    ports:
      - "8080:8080"
    volumes:
      - .:/data:z
      - nominatim-flat-data:/var/lib/nominatim:z
      - nominatim-db-data:/var/lib/postgresql/16/main:z
    depends_on:
      db:
        condition: service_healthy

  tileserver:
    image: maplibre/martin:latest
    restart: always
    ports:
      - "8081:3000"
    volumes:
      - ./martin-config.yaml:/config/config.yaml:ro
      - .:/data:ro
    command: ["--config", "/config/config.yaml"]
    depends_on:
      db:
        condition: service_healthy

  planetiler:
    image: onthegomap/planetiler:latest
    container_name: planetiler
    volumes:
      - .:/data
    command: >
      --osm-path=${OSM_PBF_URL}
      --output=/data/shortbread.pmtiles
      --profile=shortbread
      --force
    profiles:
      - import

volumes:
  postgres_data:
  nominatim-flat-data:
  nominatim-db-data:
