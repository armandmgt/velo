service: velo
image: armandmgt/velo
servers:
  web:
    - minipc.armandmgt.fr
  job:
    hosts:
      - minipc.armandmgt.fr
    cmd: bin/jobs

# The heatmap's generated tile columns rewrite the activities table on their
# first migration, which runs before the app answers its health check.
deploy_timeout: 1200

proxy:
  ssl: true
  host: velo.armandmgt.fr

registry:
  server: ghcr.io
  username: armandmgt
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://root@minipc.armandmgt.fr

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    DB_HOST: "velo-db"
    DB_USER: "postgres"
    DB_PASSWORD: "postgres"

accessories:
  db:
    image: postgis/postgis:17-3.5
    host: minipc.armandmgt.fr
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: velo_production
    volumes:
      - velo_data:/var/lib/postgresql/data:z

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "velo_storage:/rails/storage:z"


asset_path: /rails/public/assets:z
