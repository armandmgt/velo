default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USER") { "velo" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>

development:
  <<: *default
  database: velo_development

test:
  <<: *default
  database: velo_test

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
  errors:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/errors_migrate
