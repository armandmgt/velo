default: &default
  adapter: postgis
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USER") { "velo" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DEV_DB_NAME") { "velo_development" } %>
  schema_format: :sql

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME") { "velo_test" } %>
  schema_format: :sql
  # libpq's GSSAPI negotiation calls into the macOS Kerberos framework, which is
  # not fork-safe and segfaults in Rails' forked parallel test workers. We don't
  # use Kerberos auth, so skip that path entirely.
  gssencmode: disable

production:
  primary:
    <<: *default
    database: velo_production
    schema_format: :sql
  cache:
    <<: *default
    adapter: postgresql
    migrations_paths: db/cache_migrate
    database: solid_cache
  queue:
    <<: *default
    adapter: postgresql
    migrations_paths: db/queue_migrate
    database: solid_queue
  cable:
    <<: *default
    adapter: postgresql
    migrations_paths: db/cable_migrate
    database: solid_cable
  errors:
    <<: *default
    adapter: postgresql
    migrations_paths: db/errors_migrate
    database: solid_errors
