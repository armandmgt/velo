name: Velo
options:
  bundleIdPrefix: fr.armandmgt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: "1.3.0"
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"

targets:
  Velo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: HotwireNative
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.armandmgt.velo
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App-wide accent (`.tintColor`) tracks the web app's `--color-primary`:
        # orange in light, blue in dark — see Resources/Assets.xcassets/AccentColor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEVELOPMENT_TEAM: "5B86S3AWVU"
        CODE_SIGN_STYLE: Automatic
