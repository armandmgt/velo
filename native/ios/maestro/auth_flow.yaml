appId: fr.armandmgt.velo
name: Auth flow (cold-start, sign-in, tab bar appears)
tags:
  - regression
---
# At cold start the window root is an *unauthenticated* navigator pointing
# straight at /session/new. The tab bar is not part of the view hierarchy
# yet; it's only swapped in after the layout renders `sessions/meta` (whose
# `bridge--authentication` controller fires the "connect" message → native
# `AuthenticationComponent` posts `.didSignIn` → `SceneDelegate` swaps the
# root to `HotwireTabBarController`).
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true

- assertVisible: "Connexion"
- assertVisible: "Se connecter"
# Regression: tab bar must NOT be visible while signed out, otherwise the
# user can hop between tabs that all 302 to /session/new and end up with
# stale login HTML cached per tab.
- assertNotVisible: "Tableau de bord"
- assertNotVisible: "Activités"

- hideKeyboard
- tapOn: "Se connecter"

# After login the dashboard renders inside the tab bar shell. The
# "Résumé par période" h2 is a dashboard-only string (the words "Tableau
# de bord" appear in both the page title and the tab label).
- assertVisible: "Résumé par période"
- assertVisible: "Tableau de bord"
- assertVisible: "Activités"

# Tap the Activités tab. "Activités" appears three times: the "7 derniers jours"
# and "Ce mois" dashboard stat labels, then the native tab-bar item (exposed via
# its accessibilityText) last — so the tab is index 2. (The old `index: 1`
# stopped at the second stat card, which is why it silently stayed put.)
- tapOn:
    text: "Activités"
    index: 2
# The tab switched: the activities index renders, so the dashboard's "Résumé par
# période" is gone. (Its h1 is `hotwire-native:hidden` and "Nouvelle activité" is
# sm-only, leaving no stable activities-only visible string — the old "Importer
# Strava ZIP" assertion referred to UI that no longer exists.)
- assertNotVisible: "Résumé par période"
