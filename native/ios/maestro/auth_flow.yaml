appId: fr.armandmgt.velo
name: Auth flow (cold-start, sign-in, tab bar appears)
tags:
  - regression
---
# At cold start the window root is an *unauthenticated* navigator pointing
# straight at /session/new. The tab bar is not part of the view hierarchy
# yet; it's only swapped in after the layout renders `sessions/meta` (whose
# `bridge--authentication` controller fires the "connect" message → native
# `AuthenticationComponent` posts `.didSignIn` → `SceneDelegate` swaps the
# root to `HotwireTabBarController`).
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true

- assertVisible: "Connexion"
- assertVisible: "Se connecter"
# Regression: tab bar must NOT be visible while signed out, otherwise the
# user can hop between tabs that all 302 to /session/new and end up with
# stale login HTML cached per tab.
- assertNotVisible: "Tableau de bord"
- assertNotVisible: "Activités"

- hideKeyboard
- tapOn: "Se connecter"

# After login the dashboard renders inside the tab bar shell. Wait for the
# tab-bar swap animation to settle before querying webview content, then assert
# "Activités récentes" — the recent-activity section header, which is
# dashboard-only. ("Tableau de bord" and "Activités" both surface as tab-bar
# labels on every tab, so neither proves which page is on screen.)
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"
- assertVisible: "Tableau de bord"
- assertVisible: "Activités"

# Tap the Activités tab. After the dashboard redesign "Activités" matches only
# the native tab-bar item (the old dashboard stat cards whose labels also read
# "Activités" are gone), so a plain tap is unambiguous — the previous `index: 2`
# now points past the single match.
- tapOn: "Activités"
- waitForAnimationToEnd:
    timeout: 10000
# The tab switched: the activities index renders, so the dashboard-only
# "Activités récentes" recent-activity header is gone. (The activities h1 is
# `hotwire-native:hidden` and "Nouvelle activité" is sm-only, leaving no stable
# activities-only visible string to assert positively.)
- assertNotVisible: "ACTIVITÉS RÉCENTES|Activités récentes"
