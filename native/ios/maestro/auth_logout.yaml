appId: fr.armandmgt.velo
name: Logout returns to unauthenticated root
tags:
  - regression
---
# Sign in, then sign out via the top-bar overflow menu. After logout the
# tab bar must be gone and the login form must be back. The pivot is the
# `is_after_sign_out_path: true` path-property on /session/new: when a
# tab-bar navigator proposes a visit there, the `SceneDelegate` rejects
# the proposal and swaps the window root back to the unauthenticated
# navigator instead of pushing a login VC inside a tab.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true

- assertVisible: "Connexion"
- hideKeyboard
- tapOn: "Se connecter"
# Settle the post-login tab-bar swap, then assert the dashboard-only recent-
# activity header ("Résumé par période" was removed in the dashboard redesign).
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"

# Overflow menu is rendered natively as the trailing "More" UIBarButtonItem
# (the `bridge--navbar-buttons` Stimulus controller forwards the items). Match
# it by its "More" accessibility label — far steadier than a nav-bar point,
# which sat just above the button — then pick Se déconnecter from the menu.
- tapOn: "More"
- tapOn: "Se déconnecter"

# Back at the unauthenticated root: login form is visible, tab bar is gone,
# and the top-bar overflow menu is gone too (the navbar partial only renders
# for authenticated users, so the `bridge--navbar-buttons` controller
# never fires here).
- assertVisible: "Connexion"
- assertNotVisible: "Tableau de bord"
- assertNotVisible: "Activités"
- assertNotVisible: "ACTIVITÉS RÉCENTES|Activités récentes"
# The overflow ("More") UIBarButtonItem has no accessibility identifier on
# iOS — match by accessibility label instead via `text:`.
- assertNotVisible: "More"
