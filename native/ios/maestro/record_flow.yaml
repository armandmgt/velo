appId: fr.armandmgt.velo
name: Record flow (record → stop → upload → land on the new activity)
tags:
  - regression
---
# The screen opens *armed*: an explicit Démarrer starts recording, live stats and
# a point count update, and Arrêter hands the ride to the web review, which
# uploads it. This flow guards navigation, the start control, that points get
# recorded, and the upload path.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    # Pre-grant "While Using" location so the permission request the
    # recording screen now fires doesn't pop a system alert over the assertions
    # below. (We only ever request When-In-Use — never "Always".)
    permissions:
      location: inuse

- assertVisible: "Se connecter"
- hideKeyboard
- tapOn: "Se connecter"

# Settle the post-login tab-bar swap, then assert the dashboard-only recent-
# activity header ("Résumé par période" was removed in the dashboard redesign).
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"

# The native Record button is a floating UIButton (accessibilityLabel), not a
# tab — owned by RecordTabBarController so it can animate while recording.
- tapOn: "Enregistrer"

# Fully native, map-centric recording screen, presented as a full-screen modal.
# It opens *armed* (explicit-start UX): a sport picker (defaulting to the last-used
# sport, "Vélo de route" on a fresh install), Démarrer, and a "Prêt à enregistrer"
# dock card float over the live map. The nav title was dropped in the map redesign
# (only Fermer floats), so we assert the armed dock card instead of "Enregistrement".
- assertVisible: "PRÊT À ENREGISTRER"
- assertVisible: "Vélo de route"
- assertVisible: "Démarrer"
#: pause automatique is configured here, on the armed card — the only
# place it's reachable, so the setting can't shift under a ride in progress.
- assertVisible: "Pause automatique"
# Regression: the full-screen modal covers the tabs (and can't be swipe-dismissed
# — .fullScreen + isModalInPresentation), so the only way back is the button.
- assertNotVisible: "Tableau de bord"

# Start recording, then inject a fix and confirm it's received: the top GPS banner
# leaves "Recherche du GPS…" for an acquired state once a fix arrives (the same
# delegate path that persists the point to Core Data). `setLocation` is a single
# static fix, so a *moving* distance/speed is verified manually (Simulator →
# Features → Location → City Run); end-to-end persistence is proven by the created
# activity at the bottom of this flow.
- tapOn: "Démarrer"
- assertVisible: "Arrêter"
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- assertVisible: "GPS (bon|correct|moyen|faible)"

# The state now reads from the pill (the nav title is gone), and the stats live in
# a collapsible bottom dock over the map — expanded by default (the "DISTANCE"
# caption is shown only when expanded). Toggle the grabber to collapse ⇄ expand and
# confirm the caption follows; a screenshot captures the map + dock rendering.
- assertVisible: "Enregistrement"
- assertVisible: "DISTANCE"
- takeScreenshot: record-map
- tapOn:
    id: "dockGrabber"
- waitForAnimationToEnd
- assertNotVisible: "DISTANCE"
- tapOn:
    id: "dockGrabber"
- waitForAnimationToEnd
- assertVisible: "DISTANCE"

# Smoke-test the controls: lap marker, then pause ⇄ resume.
- tapOn: "Tour"

#: the Tours counter opens the split sheet. Only a smoke test here —
# Maestro's iOS driver cannot traverse a sheet presented over the full-screen
# recording modal (its contents are absent from the hierarchy even while plainly
# on screen), so this proves the tap presents and dismisses without breaking the
# screen, and the screenshot captures the rendering. The splits are asserted for
# real on the review screen below, which is an ordinary pushed controller.
#
# The *auto-pause* rules can't be driven from here either: `setLocation` plants a
# single static fix and no further updates follow, so no run of still fixes ever
# accumulates. AutoPauseDetectorTests covers the hysteresis instead.
- tapOn:
    id: "toursCell"
- waitForAnimationToEnd
- takeScreenshot: record-laps
- swipe:
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "DISTANCE"

- tapOn: "Pause"
- assertVisible: "Reprendre"
- tapOn: "Reprendre"

# Arrêter finalizes the recording and hands it to the review screen, which since
# is the web `/activities/new` presented modally — not a native screen.
# The assertions below therefore read WebView content; give the modal transition a
# beat first, or the first query races it and reads as not-visible.
- tapOn: "Arrêter"
- extendedWaitUntil:
    visible: "Nom"
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: "Supprimer"

# The review carries *both* clocks — temps écoulé beside durée de déplacement —
# so the number here is never confused with the (stricter) one the activity page
# shows. The caption is shortened to "Déplacement" to fit a third of the card;
# the term stays "durée de déplacement". These are CSS-uppercased, which iOS
# surfaces uppercased and Android surfaces DOM-cased, hence the alternation.
- assertVisible: "TEMPS ÉCOULÉ|Temps écoulé"
- assertVisible: "DÉPLACEMENT|Déplacement"
# The splits render from the handoff; laps never reach the server.
# iOS exposes the count badge and the label as separate nodes, Android merges
# them into one ("1 1 tour"), so match loosely.
- assertVisible: ".*[0-9]+ tours?.*"
# The map is a <canvas> with no accessible text, so the proof the handoff landed
# is the form: the shell's sport preselects it, which an empty form would not.
- assertVisible: "Sport"
- takeScreenshot: record-review

# Enregistrer submits the web form. The GPX is encoded in the page from the
# handoff's points and attached to the real file input via DataTransfer. On 201
# the page reports back and the shell dismisses the modal onto the created
# activity.
- tapOn: "Enregistrer"

# Landed on the created activity's show page inside the tab bar shell. The
# device names recordings "Sortie enregistrée sur le téléphone" (the <trk><name>
# default), which only appears on the activity page.
- assertVisible: "Sortie enregistrée sur le téléphone"
- assertVisible: "Tableau de bord"
