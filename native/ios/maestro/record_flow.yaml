appId: fr.armandmgt.velo
name: Record flow (record → stop → upload → land on the new activity)
tags:
  - regression
---
# S1 (#49) floated the Record button + native screen; S2 (#50) added the live GPS
# feed; S3 (#51) makes it statful: the screen opens *armed*, an explicit Démarrer
# starts recording (Core Data), and live stats + a point count update. S4 (#52)
# adds sport selection, then on Arrêter serializes the recording to GPX, uploads
# it via POST /activities, and jumps to the new activity. This flow guards
# navigation, the start control, that points get recorded, and the upload path.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    # Pre-grant "While Using" location so the S2 (#50) permission request the
    # recording screen now fires doesn't pop a system alert over the assertions
    # below. (We only ever request When-In-Use — never "Always".)
    permissions:
      location: inuse

- assertVisible: "Se connecter"
- hideKeyboard
- tapOn: "Se connecter"

# Settle the post-login tab-bar swap, then assert the dashboard-only recent-
# activity header ("Résumé par période" was removed in the dashboard redesign).
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"

# The native Record button is a floating UIButton (accessibilityLabel), not a
# tab — owned by RecordTabBarController so it can animate while recording.
- tapOn: "Enregistrer"

# Fully native recording screen, presented as a full-screen modal. It opens
# *armed* (explicit-start UX): a sport picker (defaulting to the last-used sport,
# "Vélo de route" on a fresh install) and Démarrer are shown; recording hasn't begun.
- assertVisible: "Enregistrement"
- assertVisible: "Vélo de route"
- assertVisible: "Démarrer"
# Regression: the full-screen modal covers the tabs (and can't be swipe-dismissed
# — .fullScreen + isModalInPresentation), so the only way back is the button.
- assertNotVisible: "Tableau de bord"

# Start recording, then inject a fix and confirm it's received: the top GPS banner
# leaves "Recherche du GPS…" for an acquired state once a fix arrives (the same
# delegate path that persists the point to Core Data). `setLocation` is a single
# static fix, so a *moving* distance/speed is verified manually (Simulator →
# Features → Location → City Run); end-to-end persistence is proven by the created
# activity at the bottom of this flow.
- tapOn: "Démarrer"
- assertVisible: "Arrêter"
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- assertVisible: "GPS (bon|correct|moyen|faible)"

# Smoke-test the controls: lap marker, then pause ⇄ resume.
- tapOn: "Tour"
- tapOn: "Pause"
- assertVisible: "Reprendre"
- tapOn: "Reprendre"

# Arrêter finalizes the recording and pushes the native review/confirm screen
# (S13 — #66) instead of uploading immediately: a summary, an editable sport, an
# optional name, and a visibility picker, with Enregistrer / Supprimer.
- tapOn: "Arrêter"
- assertVisible: "Vérifier la sortie"
- assertVisible: "Supprimer"
- takeScreenshot: record-review

# Enregistrer serializes the recording to GPX and uploads it via POST /activities.
# With a single static fix the activity is tiny but valid; on success the app
# routes the Activités tab to the new activity's show page and dismisses the modal.
# The dev server (already logged in above) handles the upload — the CSRF JSON
# exemption lets the out-of-webview POST through.
- tapOn: "Enregistrer"

# Landed on the created activity's show page inside the tab bar shell. The
# device names recordings "Sortie enregistrée sur le téléphone" (the <trk><name>
# default), which only appears on the activity page.
- assertVisible: "Sortie enregistrée sur le téléphone"
- assertVisible: "Tableau de bord"
