appId: fr.armandmgt.velo
name: Kill recovery (record → kill → restored paused → Reprendre → Arrêter)
tags:
  - regression
---
# Mirror of the iOS flow. A ride the app is killed during comes back paused, with
# its distance, temps écoulé, Tours and trace, and Reprendre carries on into the
# same recording.
#
# The emulator keeps repeating the last fix where the iOS simulator sends it once,
# so the kilometre that must add nothing is ridden while the app is dead rather
# than after Reprendre. Pause automatique is switched off, as in
# record_flow.yaml: those repeated still fixes would otherwise pause the ride.
# A recording killed while auto-paused is covered by RecordingRestoreTest.
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      location: allow
      notifications: allow
- runFlow: subflows/sign_in_if_needed.yaml

# Two fixes ~1.1 km apart, with a Tour between them.
- tapOn: "Enregistrer"
- extendedWaitUntil:
    visible: "Démarrer"
    timeout: 30000
# On by default after clearState.
- tapOn: "Pause automatique"
- tapOn: "Démarrer"
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- assertVisible: "Signal GPS : [0-9]+ m"
- tapOn: "^Tour$"
- setLocation:
    latitude: 48.8666
    longitude: 2.3522
- assertVisible: "1[.,]1"

# Read the clock from the collapsed dock, where it is one label, then kill.
- tapOn: "Réduire ou agrandir les statistiques"
- copyTextFrom:
    id: "elapsedTime"
- evalScript: ${output.elapsedAtKill = maestro.copiedText}
- stopApp
- setLocation:
    latitude: 48.8766
    longitude: 2.3522

# The relaunch alone takes tens of seconds, none of which may reach the clock.
# The check allows 3 s because the clock runs on between the copy and the kill.
- runFlow: subflows/relaunch.yaml
- assertVisible: "Enregistrement en cours"
- assertNotVisible:
    id: "record_fab_badge"
- tapOn: "Enregistrement en cours"
- extendedWaitUntil:
    visible: "Reprendre"
    timeout: 30000
- assertVisible: "EN PAUSE"
- assertNotVisible: "Démarrer"
- assertVisible: "1[.,]1"
- takeScreenshot: restore-paused
- tapOn: "Réduire ou agrandir les statistiques"
- copyTextFrom:
    id: "elapsedTime"
- evalScript: ${output.elapsedRestored = maestro.copiedText}
- assertTrue:
    condition: ${(function (a, b) { var s = function (t) { var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10) }; var d = s(b) - s(a); return d >= 0 && d <= 3 })(output.elapsedAtKill, output.elapsedRestored)}
    label: "temps écoulé restored to what it read at the kill"
- tapOn: "Réduire ou agrandir les statistiques"

# Reprendre records into the same ride. The first fix only anchors the new
# segment, so the kilometre ridden while the app was dead adds nothing; the next one counts.
- tapOn: "Reprendre"
- assertVisible: "Pause"
- assertVisible: "1[.,]1"
- setLocation:
    latitude: 48.8866
    longitude: 2.3522
- assertVisible: "2[.,]2"

# Arrêter hands the whole ride to the review: both Tours, and the distance from
# before and after the kill.
- tapOn: "Arrêter"
- extendedWaitUntil:
    visible: "Nom"
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: "2[.,]2[0-9]"
- assertVisible: ".*2 tours.*"
- takeScreenshot: restore-review
- tapOn: "Enregistrer"
- assertVisible: "Sortie enregistrée sur le téléphone"
