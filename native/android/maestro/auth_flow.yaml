appId: fr.armandmgt.velo
name: Auth flow (cold-start, sign-in, bottom nav appears)
tags:
  - regression
---
# Android mirror of native/ios/maestro/auth_flow.yaml. At cold start the task
# root is the unauthenticated LoginActivity (a single Hotwire fragment pointed
# at /session/new); there is no bottom nav yet. Submitting the pre-filled dev
# login fires the layout's `bridge--authentication` "connect" message, which
# AuthenticationComponent turns into a swap to MainActivity (the bottom-nav
# shell), finishing LoginActivity so it leaves the back stack.
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: "Connexion"
- assertVisible: "Se connecter"
# Regression: the bottom nav must NOT exist while signed out — it lives in
# MainActivity, not the LoginActivity root, so its tab labels are absent.
- assertNotVisible: "Tableau de bord"
- assertNotVisible: "Activités"

# No hideKeyboard: on Android it falls back to Back, which would finish the root
# LoginActivity. The dev form is pre-filled (test@example.com / dev), so submit.
- tapOn: "Se connecter"

# After login the dashboard renders inside the bottom-nav shell. Settle the
# swap, then assert "Activités récentes" — the recent-activity section header,
# dashboard-only. (It renders CSS-uppercased; the alternation tolerates iOS's
# uppercased exposure and Android's DOM-cased one. "Tableau de bord" and
# "Activités" surface as bottom-nav labels on every tab, so neither proves which
# page is on screen.)
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"
- assertVisible: "Tableau de bord"
- assertVisible: "Activités"

# Tap the Activités bottom tab. After the dashboard redesign "Activités" matches
# only the bottom-nav item (the old dashboard stat cards whose labels also read
# "Activités" are gone), so a plain tap is unambiguous — the previous `index: 2`
# now points past the single match.
- tapOn: "Activités"
- waitForAnimationToEnd:
    timeout: 10000
# The tab switched: the activities index renders, so the dashboard-only
# "Activités récentes" recent-activity header is gone. (Its own h1 is
# `hotwire-native:hidden` and "Nouvelle activité" is sm-only, leaving no stable
# activities-only *visible* string to match on.)
- assertNotVisible: "ACTIVITÉS RÉCENTES|Activités récentes"
