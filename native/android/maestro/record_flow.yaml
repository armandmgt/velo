appId: fr.armandmgt.velo
name: Record flow (record → stop → upload → land on the new activity)
tags:
  - regression
---
# Android mirror of native/ios/maestro/record_flow.yaml, adapted to the Jetpack
# Compose recording screen. The screen opens *armed*: an explicit Démarrer starts
# recording, and Arrêter hands the ride to the web review, which uploads it. This
# flow guards navigation, the start control, the live controls, lap splits, pause
# automatique, and the upload path.
- launchApp:
    clearState: true
    stopApp: true
    # Pre-grant location + notifications so neither the location request
    # nor the foreground-service POST_NOTIFICATIONS request the recording screen
    # fires pops a system dialog over the assertions below. The app only ever
    # requests While-Using location (fine/coarse) — never background location.
    permissions:
      location: allow
      notifications: allow

# Cold start lands on the unauthenticated LoginActivity (the dev login form is
# pre-filled with test@example.com / dev, so we just submit). No hideKeyboard
# here: on Android that falls back to Back, which would finish the root
# LoginActivity and drop us to the launcher.
- assertVisible: "Se connecter"
- tapOn: "Se connecter"

# After login AuthenticationComponent hands off to MainActivity (the bottom-nav
# shell). Settle the transition, then assert the dashboard-only recent-activity
# header ("Résumé par période" was removed in the dashboard redesign). It renders
# CSS-uppercased, so the alternation tolerates iOS's uppercased exposure and
# Android's DOM-cased one.
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "ACTIVITÉS RÉCENTES|Activités récentes"

# The native Record button is a floating FAB (contentDescription = "Enregistrer"),
# right-aligned above the bottom nav — not a 4th tab.
- tapOn: "Enregistrer"

# Fully native, map-centric recording screen (a full-screen Activity). It opens
# *armed*: a sport picker (defaulting to the last-used sport, "Vélo de route" on a
# fresh install), Démarrer, and a "Prêt à enregistrer" dock card float over the
# live map; recording hasn't begun.
- assertVisible: "Démarrer"
- assertVisible: "Vélo de route"
- assertVisible: "PRÊT À ENREGISTRER"
# Pause automatique is configured here, on the armed card — the only place it's
# reachable, so the setting can't shift under a ride in progress.
- assertVisible: "Pause automatique"
#: switch it off for the rest of this flow. The emulator replays its own
# GPS fix at ~1 Hz with a measured speed of 0, so a recording left armed
# auto-pauses about ten seconds in — and every step below that needs the recording
# *running* would then race that window (a single hierarchy query on this device
# costs seconds). Riding with the toggle off is also the acceptance criterion it
# proves: nothing below pauses on its own, however long the ride stands still.
#
# The hysteresis itself can't be driven from Maestro at all, for a reason of its
# own that mirrors what the iOS flow records: every fix Maestro injects is a *mock*
# fix carrying no speed (`hasSpeed()` false), and ADR 0002 is explicit that an
# unmeasurable speed must break the still run rather than extend it — only positive
# evidence may pause a recording. AutoPauseDetectorTest covers it instead: entry,
# exit by distance, exit by speed, the fix-gap restart, and both suppression rules.
- tapOn: "Pause automatique"
# Regression: the recording Activity covers the bottom nav, so the only way back
# is the controls — the dashboard tab must not be visible underneath.
- assertNotVisible: "Tableau de bord"
- takeScreenshot: record-armed

# Start recording. The armed card goes with it, taking the toggle: a ride records
# under the setting it began with, so there is nowhere to change it mid-ride.
- tapOn: "Démarrer"
- assertVisible: "Arrêter"
- assertNotVisible: "Pause automatique"

# Inject a fix: the top GPS indicator leaves "recherche…" for an accuracy readout
# once one arrives (the same callback that persists the point to Room).
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- assertVisible: "Signal GPS : [0-9]+ m"

# The state reads from the pill, and the stats live in a collapsible bottom dock
# over the map — expanded by default (the "DISTANCE" caption shows only when
# expanded). Toggle the grabber to collapse ⇄ expand and confirm it follows.
- assertVisible: "ENREGISTREMENT|Enregistrement"
- assertVisible: "DISTANCE"
- takeScreenshot: record-map
- tapOn: "Réduire ou agrandir les statistiques"
- waitForAnimationToEnd
- assertNotVisible: "DISTANCE"
- tapOn: "Réduire ou agrandir les statistiques"
- waitForAnimationToEnd
- assertVisible: "DISTANCE"

# Tour closes the running lap, and the dock's Tours counter opens the split sheet.
# One tap, with fixes either side of it, means two splits — lap 1 closed, lap 2
# running — which the sheet's footnote names. "^Tour$" anchors the lap button's
# label so it doesn't match the "Tours" counter beside it.
- tapOn: "^Tour$"
- tapOn: "^Tours$"
- waitForAnimationToEnd
- assertVisible: "Le tour 2 est en cours."
- takeScreenshot: record-laps
- tapOn: "Fermer"
- waitForAnimationToEnd

# Manual pause ⇄ resume. Tour is hidden while paused, so a stop at a red light
# can't mint a zero-distance split — pause automatique shares that state and so
# hides it too.
- tapOn: "Pause"
- assertVisible: "Reprendre"
- assertNotVisible: "^Tour$"
- tapOn: "Reprendre"
- assertVisible: "ENREGISTREMENT|Enregistrement"
- takeScreenshot: record-active

# Arrêter finalizes the recording and hands it to the review screen, which since
# is the web `/activities/new` presented modally — not a native screen.
# The assertions below therefore read WebView content; give the modal transition a
# beat first, or the first query races it and reads as not-visible. Mirrors the
# iOS flow.
- tapOn: "Arrêter"
- extendedWaitUntil:
    visible: "Nom"
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: "Supprimer"

# Both clocks, as on iOS. CSS-uppercased strings surface uppercased on iOS and
# DOM-cased on Android, hence the alternation.
- assertVisible: "TEMPS ÉCOULÉ|Temps écoulé"
- assertVisible: "DÉPLACEMENT|Déplacement"
# The splits reach the review through the handoff — the lap boundaries persisted
# in Room, read back at Arrêter. Two of them, from the single Tour tap above.
# iOS exposes the count badge and the label as separate nodes, Android merges
# them into one ("2 2 tours"), so match loosely.
- assertVisible: ".*2 tours.*"
# The map is a <canvas> with no accessible text, so the proof the handoff landed
# is the form: the shell's sport preselects it, which an empty form would not.
- assertVisible: "Sport"
- takeScreenshot: record-review

# Enregistrer submits the web form. The GPX is encoded in the page from the
# handoff's points and attached to the real file input via DataTransfer. On 201
# the page reports back and the shell leaves the modal for the created activity.
- tapOn: "Enregistrer"

# Landed on the created activity's show page inside the bottom-nav shell. The
# device names recordings "Sortie enregistrée sur le téléphone" (the <trk><name>
# default), which only appears on the activity page.
- extendedWaitUntil:
    visible: "Sortie enregistrée sur le téléphone"
    timeout: 30000
- assertVisible: "Tableau de bord"
