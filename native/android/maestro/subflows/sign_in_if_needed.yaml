appId: fr.armandmgt.velo
---
# Mirror of the iOS subflow. Sign in with the pre-filled dev user unless the
# session survived, then settle on the dashboard. Wait for either screen first, so
# a cold launch still loading isn't read as signed in. No hideKeyboard: on Android
# it falls back to Back, which would finish the root LoginActivity.
- extendedWaitUntil:
    visible: "Se connecter|ACTIVITÉS RÉCENTES|Activités récentes"
    timeout: 120000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Se connecter"
          commands:
              - tapOn: "Se connecter"
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          visible: "ACTIVITÉS RÉCENTES|Activités récentes"
          timeout: 60000
